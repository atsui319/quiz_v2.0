<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズコンソール - 究極統合版</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #eef2f3; padding: 20px; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; margin-bottom: 20px;}
        
        .genre-selector { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-genre { background: #ecf0f1; color: #7f8c8d; border: 2px solid #bdc3c7; font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .btn-genre.active { background: #3498db; color: white; border-color: #2980b9; }

        .admin-script-area { background: #fff9db; border: 2px solid #f1c40f; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .admin-ans-area { background: #e8f4fd; border: 2px solid #3498db; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .admin-label { font-size: 0.7rem; font-weight: bold; color: #7f8c8d; margin-bottom: 3px; }
        
        #adminFullText { font-size: 1rem; font-weight: bold; color: #444; line-height: 1.5; }
        #adminAnswer { font-size: 1.4rem; font-weight: bold; color: #2c3e50; }

        #display { font-size: 1.1rem; min-height: 4em; border: 2px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; white-space: pre-wrap; line-height: 1.6;}
        
        /* 文字種別出し用コントロール */
        .type-controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; justify-content: center; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-type { background: #95a5a6; color: white; font-size: 0.75rem; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-type:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.5; }

        .settings-bar { background: #f0f4f7; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 8px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
        button:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.6; }
        
        .btn-primary { background: #3498db; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .btn-next { background: #2ecc71; color: white; }
        .btn-finish { background: #2c3e50; color: white; width: 100%; margin-top: 10px; }
        .btn-sub { background: #9b59b6; color: white; width: 100%; margin-bottom: 10px; }
        
        .select-area { margin-top: 20px; padding: 15px; border: 2px solid #2ecc71; border-radius: 12px; background: #fafffa; }
        #candidateList { max-height: 300px; overflow-y: auto; }
        .candidate-card { background: white; border: 2px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; line-height: 1.4; }
        .candidate-card:hover { border-color: #2ecc71; background: #f0fff4; }
        .candidate-ans { color: #27ae60; font-weight: bold; font-size: 0.85rem; border-top: 1px dashed #eee; padding-top: 4px; margin-top: 4px; }

        .insert-area { margin-top: 20px; padding: 15px; border: 2px solid #e67e22; border-radius: 12px; background: #fff5e6; }
        .insert-input { padding: 8px; border-radius: 6px; border: 1px solid #e67e22; font-size: 0.9rem; width: 100%; box-sizing: border-box; margin-bottom: 5px; }

        #resultArea { display: none; padding: 20px; background: #fff; border-radius: 12px; border: 2px solid #2c3e50; width: 100%; max-width: 650px; }
        .result-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .result-table th, .result-table td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <button class="btn-sub" onclick="openSubWindow()">💻 視聴者用ウィンドウを開く</button>
    
    <div class="genre-selector">
        <button class="btn-genre active" onclick="changeGenre('all', event)">全ジャンル</button>
        <button class="btn-genre" onclick="changeGenre('anime', event)">アニメ・ゲーム</button>
        <button class="btn-genre" onclick="changeGenre('social', event)">社会</button>
        <button class="btn-genre" onclick="changeGenre('life', event)">ライフスタイル</button>
        <button class="btn-genre" onclick="changeGenre('sport', event)">スポーツ</button>
    </div>

    <div class="settings-bar">
        <div class="setting-item">
            <label><input type="checkbox" id="typeMode" onchange="resetState()"> <b>文字種別出しモード</b></label>
            <span>速度: <input type="range" id="speedRange" min="10" max="500" step="10" value="100" onchange="updateSpeedDisplay()"><span id="speedVal">100</span>ms</span>
        </div>
    </div>

    <div id="qNumber" style="font-size:0.9rem; margin-bottom:5px; color:#3498db; font-weight:bold;">第 - 問</div>
    
    <div class="admin-script-area">
        <div class="admin-label" style="color:#f39c12">【出題者用】全文</div>
        <div id="adminFullText">---</div>
    </div>
    <div class="admin-ans-area">
        <div class="admin-label" style="color:#3498db">【出題者用】答え</div>
        <div id="adminAnswer">---</div>
    </div>

    <div id="display">読み込み中...</div>

    <div class="type-controls" id="typeButtons" style="display:none;">
        <button id="btn-symbol" class="btn-type" onclick="revealSpecific('symbol')">記号</button>
        <button id="btn-alpha" class="btn-type" onclick="revealSpecific('alpha')">英数</button>
        <button id="btn-kanji" class="btn-type" onclick="revealSpecific('kanji')">漢字</button>
        <button id="btn-katakana" class="btn-type" onclick="revealSpecific('katakana')">カナ</button>
        <button id="btn-hiragana" class="btn-type" onclick="revealSpecific('hiragana')">かな</button>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn-primary" onclick="startQuiz()">開始 / 再開</button>
        <button id="stopBtn" class="btn-stop" onclick="stopQuiz()" disabled>停止</button>
    </div>

    <button id="showAnsBtn" class="btn-primary" style="background:#f1c40f; width:100%; margin-bottom:10px;" onclick="toggleSubAnswer()" disabled>視聴者へ答えを表示</button>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="prevBtn" class="btn-prev" onclick="prevQuestion()" disabled>前へ</button>
        <button id="nextBtn" class="btn-next" onclick="nextQuestion()">次の問題をランダム出題</button>
    </div>

    <div class="select-area">
        <div class="admin-label" style="color:#2ecc71">🎯 候補から選んで出題（全文確認）</div>
        <div id="candidateList"></div>
        <button class="btn-genre" style="width:100%; margin-top:10px;" onclick="refreshCandidates()">候補を入れ替える</button>
    </div>

    <div class="insert-area">
        <div class="admin-label" style="color:#d35400">🔥 割り込み自作出題</div>
        <input type="text" id="nowQ" class="insert-input" placeholder="問題文を入力">
        <input type="text" id="nowA" class="insert-input" placeholder="答えを入力">
        <button class="btn-primary" style="background:#e67e22; padding:8px; width:100%;" onclick="instantPlay()">この問題を今すぐ出す</button>
    </div>

    <button class="btn-finish" onclick="finishQuiz()">🏁 終了しておさらい表示</button>
</div>

<div class="container" id="resultArea">
    <h2 style="text-align:center;">📋 本日のおさらい</h2>
    <table class="result-table" id="resultTable">
        <thead><tr><th>#</th><th>問題</th><th>答え</th></tr></thead>
        <tbody></tbody>
    </table>
    <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="backToQuiz()">クイズ画面に戻る</button>
</div>

<script>
    const URLS = {
        anime: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTBRf9k4zS7Ht5s7GKejqT2d-cyWbDHd19DwTPmAzoHe40d9nV1cVu-RH565sIq9GbYmEKkzhpBytp/pub?output=csv",
        social: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXVYOqHu_0VRIkiVK0RQO-ZWPZ6pHGqIw5VxBWdOlg3-HbP3q26gM0fVxTndREhjqbaxFzcjeuoMcE/pub?output=csv",
        life: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTr7JL0lBCMLRBFi-CraPlJxzp4xrGD8RSnc8MSuoV3ORISo0iCFWMmI_FCtDlgkxwPqmv_TwAvufn/pub?output=csv",
        sport: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJYls3O8_98SKNWqx34c0V5HLIaXdxxA8v4E3c1iwrTFZBL1TSxzeem9AbKZKYfMkQEcu7bECcsgVo/pub?output=csv"
    };

    let allMasterData = { anime: [], social: [], life: [], sport: [] };
    let quizData = [];
    let history = []; 
    let currentIdx = -1;
    let isRunning = false;
    let timer = null;
    let fullText = "";
    let displayedTextArray = [];
    let subWindow = null;
    let currentSpeed = 100;

    async function init() {
        const responses = await Promise.all(Object.values(URLS).map(url => fetch(url).then(r => r.text())));
        allMasterData.anime = parseCSV(responses[0]);
        allMasterData.social = parseCSV(responses[1]);
        allMasterData.life = parseCSV(responses[2]);
        allMasterData.sport = parseCSV(responses[3]);
        changeGenre('all');
    }

    function parseCSV(text) {
        const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");
        return rows.slice(1).map(row => {
            const parts = row.split(",");
            return { q: parts[0] || "", a: parts[1] || "" };
        });
    }

    function changeGenre(genre, event) {
        if (event) {
            document.querySelectorAll('.btn-genre').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        quizData = genre === 'all' ? [...allMasterData.anime, ...allMasterData.social, ...allMasterData.life, ...allMasterData.sport] : [...allMasterData[genre]];
        currentIdx = -1;
        history = [];
        refreshCandidates();
        nextQuestion();
    }

    function refreshCandidates() {
        const listEl = document.getElementById("candidateList");
        listEl.innerHTML = "";
        const shuffled = [...quizData].sort(() => 0.5 - Math.random()).slice(0, 5);
        shuffled.forEach(item => {
            const div = document.createElement("div");
            div.className = "candidate-card";
            div.innerHTML = `<div>${item.q}</div><div class="candidate-ans">答：${item.a}</div>`;
            div.onclick = () => selectCandidate(item);
            listEl.appendChild(div);
        });
    }

    function selectCandidate(item) {
        history.push(item);
        currentIdx = history.length - 1;
        resetState();
        refreshCandidates();
    }

    function instantPlay() {
        const q = document.getElementById("nowQ").value;
        const a = document.getElementById("nowA").value;
        if (!q || !a) return alert("入力してください");
        history.push({ q, a });
        currentIdx = history.length - 1;
        document.getElementById("nowQ").value = "";
        document.getElementById("nowA").value = "";
        resetState();
    }

    function nextQuestion() {
        if (currentIdx < history.length - 1) {
            currentIdx++;
        } else {
            const randomItem = quizData[Math.floor(Math.random() * quizData.length)];
            history.push(randomItem);
            currentIdx = history.length - 1;
        }
        resetState();
        refreshCandidates();
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            resetState();
        }
    }

    function resetState() {
        isRunning = false;
        clearInterval(timer);
        if (currentIdx === -1) return;
        const item = history[currentIdx];
        fullText = item.q;
        document.getElementById("adminFullText").innerText = fullText;
        document.getElementById("adminAnswer").innerText = item.a;
        document.getElementById("qNumber").innerText = `第 ${currentIdx + 1} 問`;

        const isTypeMode = document.getElementById("typeMode").checked;
        if (isTypeMode) {
            displayedTextArray = new Array(fullText.length).fill("＿");
            document.getElementById("typeButtons").style.display = "flex";
            ["symbol", "alpha", "kanji", "katakana", "hiragana"].forEach(cat => document.getElementById(`btn-${cat}`).disabled = false);
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = true;
            document.getElementById("showAnsBtn").disabled = false;
        } else {
            displayedTextArray = [];
            document.getElementById("typeButtons").style.display = "none";
            document.getElementById("startBtn").disabled = false;
            document.getElementById("stopBtn").disabled = true;
            document.getElementById("showAnsBtn").disabled = true;
        }

        document.getElementById("prevBtn").disabled = (currentIdx === 0);
        syncDisplay();
        if (subWindow && !subWindow.closed) {
            subWindow.document.getElementById("ans").style.display = "none";
            subWindow.document.getElementById("quiz-view").style.display = "flex";
            subWindow.document.getElementById("result-view").style.display = "none";
        }
    }

    function startQuiz() {
        if (isRunning || document.getElementById("typeMode").checked) return;
        isRunning = true;
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
        startTimer();
    }

    function startTimer() {
        let i = displayedTextArray.length;
        timer = setInterval(() => {
            if (i < fullText.length) {
                displayedTextArray.push(fullText[i]);
                syncDisplay();
                i++;
            } else { stopQuiz(); }
        }, currentSpeed);
    }

    function stopQuiz() {
        isRunning = false;
        clearInterval(timer);
        document.getElementById("stopBtn").disabled = true;
        document.getElementById("startBtn").disabled = false;
        document.getElementById("showAnsBtn").disabled = false;
    }

    function revealSpecific(category) {
        const patterns = {
            symbol: /[、。！？（）「」『』\s]/, alpha: /[a-zA-Z0-9０-９ａ-ｚＡ-Ｚ]/,
            kanji: /[一-龠]/, katakana: /[ァ-ヴー]/, hiragana: /[ぁ-ん]/
        };
        for (let i = 0; i < fullText.length; i++) {
            if (patterns[category].test(fullText[i])) displayedTextArray[i] = fullText[i];
        }
        syncDisplay();
        document.getElementById(`btn-${category}`).disabled = true;
    }

    function updateSpeedDisplay() {
        currentSpeed = parseInt(document.getElementById("speedRange").value);
        document.getElementById("speedVal").innerText = currentSpeed;
        if (isRunning) { clearInterval(timer); startTimer(); }
    }

    function syncDisplay() {
        const text = displayedTextArray.join("");
        document.getElementById("display").innerText = text;
        if (subWindow && !subWindow.closed) {
            subWindow.document.getElementById("text").innerText = text;
            subWindow.document.getElementById("num").innerText = `第 ${currentIdx + 1} 問`;
        }
    }

    function toggleSubAnswer() {
        if (subWindow && !subWindow.closed) {
            const ansEl = subWindow.document.getElementById("ans");
            ansEl.innerText = history[currentIdx].a;
            ansEl.style.display = "block";
        }
    }

    function openSubWindow() {
        subWindow = window.open("", "QuizDisplay", "width=1280,height=720");
        subWindow.document.write(`
            <html><head><style>
                body { background: radial-gradient(circle, #2c3e50 0%, #000 100%); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
                #num { position: absolute; top: 40px; left: 40px; font-size: 2.5rem; color: #3498db; font-weight: 900; border-left: 10px solid #3498db; padding-left: 20px;}
                #text { font-size: 3.5rem; line-height: 1.4; font-weight: 700; width: 85%; text-align: center; white-space: pre-wrap;}
                #ans { font-size: 5rem; color: #f1c40f; display: none; font-weight: 900; border: 8px solid #f1c40f; padding: 10px 50px; border-radius: 20px; margin-top: 30px; }
                #result-view { display: none; width: 90%; font-size: 1.5rem; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; max-height: 85vh; overflow-y: auto; }
                .r-table { width: 100%; border-collapse: collapse; }
                .r-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.2); }
                .r-ans { color: #f1c40f; font-weight: bold; }
            </style></head>
            <body>
                <div id="num"></div>
                <div id="quiz-view" style="display:flex; flex-direction:column; align-items:center;">
                    <div id="text"></div><div id="ans"></div>
                </div>
                <div id="result-view"><h1>📋 本日のおさらい</h1><table class="r-table"><tbody id="r-body"></tbody></table></div>
            </body></html>
        `);
    }

    function finishQuiz() {
        const tbody = document.querySelector("#resultTable tbody");
        tbody.innerHTML = "";
        let subHtml = "";
        history.forEach((item, i) => {
            tbody.innerHTML += `<tr><td>${i+1}</td><td>${item.q}</td><td>${item.a}</td></tr>`;
            subHtml += `<tr><td>${i+1}</td><td>${item.q}</td><td class="r-ans">${item.a}</td></tr>`;
        });
        if (subWindow && !subWindow.closed) {
            subWindow.document.getElementById("quiz-view").style.display = "none";
            subWindow.document.getElementById("num").innerText = "";
            subWindow.document.getElementById("r-body").innerHTML = subHtml;
            subWindow.document.getElementById("result-view").style.display = "block";
        }
        document.getElementById("mainContainer").style.display = "none";
        document.getElementById("resultArea").style.display = "block";
    }

    function backToQuiz() {
        document.getElementById("resultArea").style.display = "none";
        document.getElementById("mainContainer").style.display = "block";
        resetState();
    }

    init();
</script>
</body>
</html>
