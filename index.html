<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早押しクイズ - スプレッドシート同期版</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #eef2f3; padding: 20px; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        h1 { font-size: 1.2rem; color: #555; margin: 0; }
        #qNumber { font-weight: bold; color: #3498db; font-size: 1.2rem; }
        
        #display { 
            font-size: 1.2rem; min-height: 4em; border: 2px solid #ddd; 
            padding: 15px; border-radius: 8px; margin-bottom: 15px; line-height: 1.5; 
            background: #f9f9f9; white-space: pre-wrap; word-break: break-all;
        }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .type-controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; justify-content: center; }
        button { 
            padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 1rem; font-weight: bold; transition: 0.2s; 
        }
        button:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.6; }
        .btn-primary { background: #3498db; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .btn-next { background: #2ecc71; color: white; }
        .btn-type { background: #95a5a6; color: white; font-size: 0.8rem; padding: 8px; }
        
        #ansBox { 
            margin-top: 15px; padding: 15px; background: #fff3cd; 
            border-left: 5px solid #ffc107; border-radius: 4px; display: none;
        }
        .status-msg { font-size: 0.8rem; color: #7f8c8d; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="qNumber">読み込み中...</h1>
        <div>
            <input type="checkbox" id="typeMode"> <label for="typeMode">文字種別出し</label>
        </div>
    </div>

    <div id="display">スプレッドシートからデータを取得しています...</div>

    <div class="type-controls" id="typeButtons" style="display:none;">
        <button id="btn-symbol" class="btn-type" onclick="revealSpecific('symbol')">記号</button>
        <button id="btn-alpha" class="btn-type" onclick="revealSpecific('alpha')">英数</button>
        <button id="btn-kanji" class="btn-type" onclick="revealSpecific('kanji')">漢字</button>
        <button id="btn-katakana" class="btn-type" onclick="revealSpecific('katakana')">カナ</button>
        <button id="btn-hiragana" class="btn-type" onclick="revealSpecific('hiragana')">かな</button>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn-primary" onclick="startQuiz()">開始 (Space)</button>
        <button id="stopBtn" class="btn-stop" onclick="stopQuiz()" disabled>停止 (Space)</button>
        <button id="resumeBtn" class="btn-primary" onclick="resumeQuiz()" disabled>再開</button>
        <button id="nextBtn" class="btn-next" onclick="nextQuestion()" disabled>次の問題</button>
    </div>

    <div id="ansBox">
        <strong>答え:</strong> <span id="answerText"></span>
        <div style="margin-top:10px; display: flex; gap:10px;">
            <button id="correctBtn" style="flex:1; background:#2ecc71; color:white;" onclick="handleResult(true)">正解</button>
            <button id="wrongBtn" style="flex:1; background:#e74c3c; color:white;" onclick="handleResult(false)">不正解</button>
        </div>
    </div>
    <div id="status" class="status-msg"></div>
</div>

<script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTBRf9k4zS7Ht5s7GKejqT2d-cyWbDHd19DwTPmAzoHe40d9nV1cVu-RH565sIq9GbYmEKkzhpBytp/pub?output=csv";

    let quizData = [];
    let currentIdx = 0;
    let isRunning = false;
    let timer = null;
    let displayedText = [];
    let fullText = "";

    const els = {
        display: document.getElementById("display"),
        qNumber: document.getElementById("qNumber"),
        answerText: document.getElementById("answerText"),
        ansBox: document.getElementById("ansBox"),
        startBtn: document.getElementById("startBtn"),
        stopBtn: document.getElementById("stopBtn"),
        resumeBtn: document.getElementById("resumeBtn"),
        nextBtn: document.getElementById("nextBtn"),
        typeMode: document.getElementById("typeMode"),
        typeButtons: document.getElementById("typeButtons"),
        status: document.getElementById("status")
    };

    // 初期データの読み込み
    async function loadData() {
        try {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error("取得に失敗しました");
            const csvText = await response.text();
            
            // CSVを簡易パース
            const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
            quizData = rows.slice(1).map(row => {
                const parts = row.split(",");
                return { q: parts[0] || "", a: parts[1] || "" };
            });

            if (quizData.length === 0) throw new Error("データが空です");
            resetState();
        } catch (e) {
            els.display.innerText = "【読み込みエラー】\nスプレッドシートのURLを確認するか、ブラウザでこのファイルを「http」経由で開いてください。";
            console.error(e);
        }
    }

    function resetState() {
        isRunning = false;
        clearInterval(timer);
        fullText = quizData[currentIdx].q;
        displayedText = new Array(fullText.length).fill("＿");
        els.display.innerText = displayedText.join("");
        els.ansBox.style.display = "none";
        els.startBtn.disabled = false;
        els.stopBtn.disabled = true;
        els.resumeBtn.disabled = true;
        els.nextBtn.disabled = true;
        els.typeButtons.style.display = els.typeMode.checked ? "flex" : "none";
        
        // 文字種別ボタンの初期化
        ["symbol", "alpha", "kanji", "katakana", "hiragana"].forEach(cat => {
            const btn = document.getElementById(`btn-${cat}`);
            if(btn) btn.disabled = false;
        });

        els.qNumber.innerText = `第 ${currentIdx + 1} 問`;
        els.answerText.innerText = quizData[currentIdx].a;
        els.status.innerText = `全 ${quizData.length} 問読み込み完了`;
    }

    function startQuiz() {
        if (isRunning) return;
        isRunning = true;
        els.startBtn.disabled = true;
        els.stopBtn.disabled = false;
        
        let i = 0;
        timer = setInterval(() => {
            if (i < fullText.length) {
                displayedText[i] = fullText[i];
                els.display.innerText = displayedText.join("");
                i++;
            } else {
                stopQuiz();
            }
        }, 100);
    }

    function stopQuiz() {
        isRunning = false;
        clearInterval(timer);
        els.stopBtn.disabled = true;
        els.resumeBtn.disabled = false;
        els.nextBtn.disabled = false;
        els.ansBox.style.display = "block";
    }

    function resumeQuiz() {
        els.resumeBtn.disabled = true;
        els.ansBox.style.display = "none";
        startQuiz();
    }

    function nextQuestion() {
        currentIdx = (currentIdx + 1) % quizData.length;
        resetState();
    }

    function handleResult(isCorrect) {
        nextQuestion();
    }

    // 文字種別出し用ロジック
    function revealSpecific(category) {
        const patterns = {
            symbol: /[、。！？（）「」『』\s]/,
            alpha: /[a-zA-Z0-9]/,
            kanji: /[一-龠]/,
            katakana: /[ァ-ヴー]/,
            hiragana: /[ぁ-ん]/
        };
        
        for (let i = 0; i < fullText.length; i++) {
            if (patterns[category].test(fullText[i])) {
                displayedText[i] = fullText[i];
            }
        }
        els.display.innerText = displayedText.join("");
        document.getElementById(`btn-${category}`).disabled = true;
    }

    // スペースキー制御
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isRunning) stopQuiz();
            else if (!els.startBtn.disabled) startQuiz();
        }
    });

    els.typeMode.addEventListener('change', resetState);

    loadData();
</script>
</body>
</html>
